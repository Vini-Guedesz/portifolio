spring.application.name=portifolio
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/portifolio}
spring.datasource.username=${DATABASE_USERNAME:portifolio}
spring.datasource.password=${DATABASE_PASSWORD:portifolio}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

app.jwt.secret=${JWT_SECRET:troque-esta-chave-por-uma-chave-segura-com-mais-de-32-caracteres}
app.jwt.expiracao-ms=${JWT_EXPIRACAO_MS:86400000}
app.jwt.refresh-expiracao-ms=${JWT_REFRESH_EXPIRACAO_MS:604800000}
app.cors.origem=${FRONTEND_URL:http://localhost:5173}
app.admin.nome=${ADMIN_NOME:Administrador}
app.admin.email=${ADMIN_EMAIL:admin@portfolio.com}
app.admin.senha=${ADMIN_PASSWORD:admin123}
app.admin.exigir-troca-primeiro-acesso=${ADMIN_EXIGIR_TROCA_PRIMEIRO_ACESSO:true}
app.auth.login.max-tentativas=${AUTH_LOGIN_MAX_TENTATIVAS:5}
app.auth.login.janela-minutos=${AUTH_LOGIN_JANELA_MINUTOS:10}
app.auth.login.bloqueio-minutos=${AUTH_LOGIN_BLOQUEIO_MINUTOS:15}
app.upload.dir=${UPLOAD_DIR:uploads}
